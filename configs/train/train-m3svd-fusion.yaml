# GaussianFusion Training Configuration
# Paper-aligned multi-modal temporal fusion with 2D Gaussian splatting
# (compressed for a single RTX 5090, ~32GB VRAM)

seed: 42

# Model
model:
  name: gaussian-fusion
  args:
    encoder_spec:
      name: edsr-baseline
      args:
        n_resblocks: 8          # 16 -> 8  (compression)
        n_feats: 48             # 64 -> 48 (compression)
        res_scale: 1
        scale: [1]
        no_upsampling: true
        n_colors: 48
        rgb_range: 1
        pretrained_path: null
    flow_model: searaft           # 光流模型: spynet | searaft (RAFT, 更强)
    searaft_pretrained: /root/autodl-tmp/GaussianFusion/models/weights/Tartan-C-T-TSKH-spring540x960-S.pth
    spynet_pretrained: sintel-final
    n_feats: 48                 # 64 -> 48 (compression)
    freeze_spynet: true
    occ_threshold: 5.0
    gaussian_render_mode: motion
    motion_force_dense: false
    motion_dense_mode: none
    full_res_color: false       # 全分辨率颜色预测（实验表明非关键；关闭以保持论文对齐 + 兼容已有 checkpoint）
    flow_driven_xyz: false      # 论文规定：flow 只用于构造 F_tau，不再驱动 xyz（double motion compensation）
    occ_fusion: true            # CGM 用前后向一致性遮挡融合替代坍缩的学习 mask（消除双影）
    occ_gamma: 4.0              # 遮挡 mask 陡峭度（越大越接近硬选择）
    occ_gamma_flow_ref: 10.0    # 自适应 gamma 的光流幅值参考（大位移下软化遮挡惩罚）
    motion_window_gain: 4.0     # 光流幅值 -> offset 窗口放大的增益
    motion_window_max: 18.0     # offset 窗口放大上限（大位移需要更大窗口）
    motion_window_flow_ref: 20.0  # 达到该光流幅值时窗口放大 gain 倍
    # AOW 正则形状：w 是 {1..10} 的 softmax 凸组合，恒 >=1，故旧的 (w-1).abs()
    # 等价于 (w-1)，是一路把窗口往最小值拖，与大运动需要大窗口直接对抗。
    aow_penalty: motion_hinge  # l1(旧) | hinge(全局上限) | motion_hinge(逐像素上限)
    aow_window_cap: 10.0       # 运动最强处允许的窗口上限（= window_bank 最大值）
    # 残差光流：光流网络冻结，且下游按「匀速线性」把位移取为 tau*flow，无人能纠正
    # 该假设的偏差。小头预测该偏差，最后一层 zero-init，第 0 步等价于原 pipeline。
    residual_flow: true
    residual_flow_hidden: 64
    residual_flow_max: 32.0      # 残差幅度软饱和上限(px)，防止 warp 采样到图外

# Training dataset
train_dataset:
  name: m3svd-temporal-fusion
  args:
    root_path: ./data/M3SVD
    split: train
    vis_modality: visible_Enhance
    ir_modality: infrared_Enhance
    n_min: 2                   # 相邻帧插帧 (gap=1: 帧 i 与 i+2, GT 为 i+1, tau=0.5)
    n_max: 12
    scale_min: 1.0
    scale_max: 1.0
    patch_size: 224            # 256 -> 224 (compression)
    augment: true
    # 空间采样：M3SVD 帧为 480x640，224 窗口只覆盖 16% 画面，而位移 >10px 的
    # 像素仅约 3%，均匀随机裁剪绝大多数落在静止背景上，模型很少见到大运动。
    crop_strategy: hybrid      # random | motion | resize | hybrid
    motion_crop_prob: 0.80     # 按帧间运动能量挑选裁剪位置的比例
    resize_crop_prob: 0.10     # 整帧等比缩放（保留完整场景，位移会同比缩小）
    motion_crop_gamma: 32.0    # 能量加权指数：实测 >10px 像素占比 3.0%->10.1%，
                               # 每样本最大位移 P50 5.0->16.1；再往上收益 <0.4%
    motion_crop_downscale: 8   # 能量图降采样倍率（滤除纹理噪声与压缩伪影）

# Training hyperparameters
batch_size: 24                  # 16 -> 8 (compression for 32GB VRAM)
num_workers: 8
epochs: 30
warmup_epochs: 2
lr: 1.0e-4
weight_decay: 0
use_amp: true
save_every: 1
val_every: 1
# Loss weights
lambda_int: 1.0
lambda_color: 1.0
lambda_grad: 2.0
lambda_temporal: 0.0           # CGM 不再产生对抗坍缩正则
lambda_aux_vis: 1.0            # F_tau -> Vi_tau 重建损失（保留可见光中间内容）
lambda_aux_ir: 1.0             # F_tau -> IR_tau 重建损失（保留红外热源中间内容）
lambda_aow: 0.01               # AOW 窗口正则：抑制 SIREN 坍缩到最大窗口
